services:
  - type: web
    name: react-stockfish-engine
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ENGINE_HOST
        value: 0.0.0.0
      - key: ENGINE_PORT
        value: 10000
      - key: ENGINE_CORS_ORIGIN
        sync: false
